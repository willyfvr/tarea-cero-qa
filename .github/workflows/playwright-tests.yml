name: Playwright E2E Tests

on:
  # 1. Manual trigger (allows running from GitHub UI)
  workflow_dispatch:

  # 2. Scheduled trigger (runs automatically via Cron)
  # Example: Every day at 8:00 AM UTC
  schedule:
    - cron: '0 8 * * *'

  # 3. Optional: Run on every push or pull request to main
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-style: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with Dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      # 4. Upload HTML Report as an Artifact
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30